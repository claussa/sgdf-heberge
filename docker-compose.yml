# Postgres local de dev uniquement.
# En prod : Scaleway Managed Database (fr-par), provisionnée par infra/ (Terraform).
services:
  db:
    image: postgres:16-alpine
    container_name: sgdf-heberge-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: adherents
    ports:
      # 5433 côté hôte : 5432 est souvent occupé par un Postgres local
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d adherents"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  dbdata:
